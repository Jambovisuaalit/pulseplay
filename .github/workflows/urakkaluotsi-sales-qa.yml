name: Urakkaluotsi sales QA
on:
  push:
    branches: [feature/urakkaluotsi-sales-page, feature/urakkaluotsi-foundation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sales-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: node tests/auth-http.cjs --missing
      - run: node tests/auth-http.cjs
      - name: Chromium browser QA
        run: node tests/browser-qa.cjs
      - name: Frozen PDF integrity and page count
        run: node tests/verify-demo.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: urakkaluotsi-sales-qa
          path: |
            qa-output/results.json
            qa-output/pdf-verification.json
            qa-output/*.png
          if-no-files-found: warn
