name: Urakkaluotsi sales QA
on:
  push:
    branches: [feature/urakkaluotsi-sales-page, feature/urakkaluotsi-foundation, feature/urakkaluotsi-data-model, feature/urakkaluotsi-pilot-metrics, feature/urakkaluotsi-sales-polish]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sales-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: node tests/domain-http.cjs
      - run: node tests/auth-http.cjs --missing
      - run: node tests/auth-http.cjs
      - name: Install QA browser driver only
        run: npm install --no-save --package-lock=false --ignore-scripts playwright
      - name: Chromium sales and contact QA
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tests/sales-polish-qa.cjs
      - name: Frozen PDF integrity and page count
        run: node tests/verify-demo.cjs
      - name: Complete local simulation and ops browser QA
        env:
          OPS_BROWSER_QA: 'true'
        run: node tests/ops-http.cjs
      - name: Thirty-delivery synthetic metric rehearsal
        run: node --experimental-strip-types scripts/run-pilot.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: urakkaluotsi-sales-qa
          path: |
            qa-output/sales-polish-results.json
            qa-output/pdf-verification.json
            qa-output/*.png
            qa-output/ops-browser.json
            qa-output/ops-simulation.pdf
            qa-output/pilot/
          if-no-files-found: warn
