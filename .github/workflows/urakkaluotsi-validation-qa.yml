name: Urakkaluotsi P0 and relevance regression

on:
  pull_request:
    paths:
      - 'workers/**'
      - 'lib/**'
      - 'app/**'
      - 'components/**'
      - 'tests/**'
      - 'data/validation/**'
      - 'schemas/**'
      - 'package.json'
      - '.github/workflows/urakkaluotsi-validation-qa.yml'
  push:
    branches: ['fix/urakkaluotsi-p0-validation']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install 'pypdf>=5,<7'
      - run: python -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Evaluate independent source-gold paired metrics (fail closed)
        run: |
          python -B workers/evaluate_paired_source_gold.py --cases data/validation/public_pdf_paired_cases_2026-10-19.json --output /tmp/urakkaluotsi_paired_metrics.json
          python -B -c 'import json; x=json.load(open("/tmp/urakkaluotsi_paired_metrics.json")); assert x["paired_source_verified"] == 0 and x["precision_at_30"] is None and x["improvement_verified"] is False'
      - name: Evaluate Uusimaa source coverage (fail closed)
        run: |
          python -B workers/evaluate_uusimaa_document_coverage.py --queue data/validation/uusimaa_document_coverage_queue_2026-10-19.json --output /tmp/uusimaa_source_coverage.json
          python -B -c 'import json; r=json.load(open("/tmp/uusimaa_source_coverage.json")); assert r["complete_packages"] == 0 and r["source_gold_positives"] == 0 and r["precision_at_30"] is None'
      - run: node --test tests/*.test.mjs
      - run: python -B workers/build_validation_set.py
      - run: python -B workers/score_validation.py
      - name: Evaluate deferred and conditional queue against frozen AI-silver holdout
        run: python -B workers/evaluate_holdout_v2.py
      - name: Source XML evaluation with explicit missing-coverage report
        run: |
          mkdir -p data/validation/source_xml_inputs
          python -B workers/evaluate_source_xml.py --snapshot data/validation/holdout_52_2026-10-19/holdout_raw.json --xml-dir data/validation/source_xml_inputs --output /tmp/urakkaluotsi_source_xml_coverage.json
          python -B -c 'import json; x=json.load(open("/tmp/urakkaluotsi_source_xml_coverage.json")); assert x["notices_total"] == 52 and x["official_precision"] is None and x["accuracy_improvement_verified"] is False'
      - name: Verify the independent-label gate remains closed
        run: |
          python -B -c 'import json; m=json.load(open("data/validation/independent_100/metrics.json")); assert m["rows_total"] == 100; assert m["rows_unreviewed"] == 0 or m["relevance_gate"] == "NOT MEASURED"'
      - run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - run: npm run typecheck
      - run: npm run build
