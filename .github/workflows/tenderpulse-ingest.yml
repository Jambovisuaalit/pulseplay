name: TenderPulse ingest
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hilma-ingest
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Collect official API metadata only
        env:
          HILMA_API_KEY: ${{ secrets.HILMA_API_KEY }}
        run: python3 workers/fetch_hilma.py
      - name: Upload public metadata store
        uses: actions/upload-artifact@v4
        with:
          name: tenderpulse-ingest-metadata
          retention-days: 7
          if-no-files-found: error
          path: data/hilma_raw.json
# Manual until rotated credentials and live scope are verified. No attachment,
# OCR, LLM, prospect profile, private digest or sending steps in this workflow.
