name: Urakkaluotsi PR12 storage QA
on:
  push:
    branches:
      - feature/urakkaluotsi-durable-storage
  pull_request:
    branches:
      - feature/urakkaluotsi-sales-polish
  workflow_dispatch:
permissions:
  contents: read
jobs:
  storage-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: npm ci
      - name: Unit and Python regression suites
        run: npm test
      - name: Typecheck and production build
        run: |
          npm run lint
          npm run build
      - name: HTTP authentication positive and negative paths
        run: |
          node tests/auth-http.cjs
          node tests/auth-http.cjs --missing
      - name: Full synthetic portal HTTP workflow
        run: node tests/ops-http.cjs
      - name: Verify synthetic database grants and CAS using isolated PGlite
        run: |
          npm install --prefix "$RUNNER_TEMP/urakkaluotsi-pglite" --no-audit --no-fund @electric-sql/pglite@0.3.15
          PGLITE_MODULE="$RUNNER_TEMP/urakkaluotsi-pglite/node_modules/@electric-sql/pglite/dist/index.js" node --experimental-strip-types tests/ops-database-sql.mjs
      - name: Verify browser bundle does not reference database secret
        run: |
          if grep -REq 'TP_SUPABASE_SECRET_KEY|sb_secret_' .next/static; then
            echo 'FAIL: server secret identifier in browser assets'
            exit 1
          fi
          echo 'PASS: no server key pattern in client assets'
