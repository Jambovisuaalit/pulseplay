name: Urakkaluotsi bounded original XML evidence pilot
on:
  push:
    branches: ['fix/urakkaluotsi-p0-validation']
    paths:
      - 'workers/collect_xml_evidence_pilot.py'
      - '.github/workflows/urakkaluotsi-xml-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Collect at most six selected original eForms notices and compare
        env:
          HILMA_API_KEY: ${{ secrets.HILMA_API_KEY }}
        run: python -B workers/collect_xml_evidence_pilot.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: urakkaluotsi-original-xml-evidence
          path: /tmp/urakkaluotsi_xml_eval/
          retention-days: 7
          if-no-files-found: warn
