name: Urakkaluotsi data model
on:
  push:
    branches: [feature/urakkaluotsi-data-model]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: workflow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_TEST_URL: postgresql://postgres:synthetic-ci-only@localhost:5432/workflow_test
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap synthetic Auth roles
        run: psql "$DB_TEST_URL" -v ON_ERROR_STOP=1 -f database/tests/bootstrap.sql
      - name: Apply schema source in order
        run: |
          for source in database/0*.sql; do
            psql "$DB_TEST_URL" -v ON_ERROR_STOP=1 -f "$source"
          done
      - name: Assert RLS, versions and history
        run: psql "$DB_TEST_URL" -v ON_ERROR_STOP=1 -f database/tests/invariants.sql
